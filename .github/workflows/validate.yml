name: Validate Resideo Native

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packaging:
    name: Packaging and Python checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate repository packaging
        run: python tools/check_repository.py
      - name: Run packaging tests
        run: |
          python -m unittest discover -s tests -p 'test_packaging.py' -v
          python -m unittest discover -s tests -p 'test_review_evidence.py' -v
      - name: Compile integration Python code
        run: python -m compileall -q custom_components

  runtime-tests:
    name: Protocol and Home Assistant 2026.10.2 tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install pinned Home Assistant test harness
        run: python -m pip install -r requirements-test.txt
      - name: Run offline regression suite
        run: python -m pytest -q

  editor-tests:
    name: Visual editor logic and browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser

  hacs:
    name: HACS Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
