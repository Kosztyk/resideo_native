name: Publish Resideo Native v0.1.6

on:
  workflow_run:
    workflows:
      - Validate Resideo Native
    types:
      - completed

permissions:
  contents: write

jobs:
  publish:
    name: Release after successful main validation
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Publish validated release once
        env:
          GH_TOKEN: ${{ github.token }}
          VALIDATED_SHA: ${{ github.event.workflow_run.head_sha }}
        shell: bash
        run: |
          set -euo pipefail
          CURRENT_SHA="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$CURRENT_SHA" != "$VALIDATED_SHA" ]]; then
            echo "main advanced since validation. Skipping a stale release."
            exit 0
          fi
          VERSION="$(python -c 'import json; print(json.load(open("custom_components/resideo_native/manifest.json"))["version"])')"
          if [[ "$VERSION" != "0.1.6" ]]; then
            echo "Auto-publishing is restricted to v0.1.6."
            exit 0
          fi
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "Release already published."
            exit 0
          fi
          gh release create "v$VERSION" \
            --target "$VALIDATED_SHA" \
            --title "Resideo Native v$VERSION" \
            --notes-file RELEASE_NOTES_0.1.6.md \
            --latest
